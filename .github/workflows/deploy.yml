name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Two quick pushes must not run migrations and `up -d` against prod at the same time.
# Queue instead of cancelling: a cancelled run could stop between migration and restart.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Type-check, lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check server
        run: npx tsc --noEmit

      - name: Type-check WebApp client
        run: npx tsc -p tsconfig.client.json --noEmit

      - name: Lint (errors only)
        run: npm run lint -- --quiet

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Переходим в директорию проекта
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Авторизуемся в GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Экспортируем переменные окружения
            export GITHUB_REPOSITORY=${{ github.repository }}
            export BOT_TOKEN=${{ secrets.BOT_TOKEN }}
            export DB_HOST=${{ secrets.DB_HOST }}
            export DB_PORT=${{ secrets.DB_PORT }}
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export DB_DATABASE=${{ secrets.DB_DATABASE }}
            export WEBAPP_URL=${{ secrets.WEBAPP_URL }}
            export GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            
            # Тянем новый образ, пока старый контейнер ещё обслуживает трафик
            docker compose -f docker-compose.prod.yml pull
            
            # Миграции гоняем ДО подъёма нового кода: одноразовый контейнер из
            # нового образа (db поднимется сам через depends_on), старый бот в это
            # время продолжает обслуживать трафик. Если мигрировать после up -d,
            # новый код успевает стартовать на ещё не мигрированной схеме.
            echo "🔄 Running database migrations..."
            if ! docker compose -f docker-compose.prod.yml run --rm -T bot npm run migration:run; then
              echo "❌ Migrations failed — aborting deploy, old container left serving"
              exit 1
            fi
            
            # Пересоздаём только то, что изменилось: bot поднимется на новом образе,
            # db останется работать. Никакого down — он гасил и базу тоже и давал
            # несколько минут простоя на каждом деплое.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Удаляем неиспользуемые образы
            docker image prune -af
            
            # Проверяем статус
            docker compose -f docker-compose.prod.yml ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            
            cid=$(docker compose -f docker-compose.prod.yml ps -q bot)
            
            if [ -z "$cid" ]; then
              echo "❌ Bot container does not exist!"
              docker compose -f docker-compose.prod.yml logs --tail=100 bot
              exit 1
            fi
            
            # Ждём именно healthy, а не "контейнер существует": при крашлупе
            # restart: unless-stopped бесконечно поднимает падающий контейнер,
            # и проверка на существование считала бы такой деплой успешным.
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)
              restarts=$(docker inspect --format '{{.RestartCount}}' "$cid" 2>/dev/null || echo 0)
            
              if [ "$status" = "healthy" ]; then
                echo "✅ Deployment successful (healthy after $((i * 5))s, $restarts restarts)"
                exit 0
              fi
            
              if [ "$restarts" -gt 3 ]; then
                echo "❌ Bot container is crash-looping ($restarts restarts)"
                docker compose -f docker-compose.prod.yml logs --tail=100 bot
                exit 1
              fi
            
              echo "⏳ health=$status restarts=$restarts ($((i * 5))s)"
              sleep 5
            done
            
            echo "❌ Bot did not become healthy in 150s"
            docker compose -f docker-compose.prod.yml logs --tail=100 bot
            exit 1

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "❌ Deployment failed for ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
